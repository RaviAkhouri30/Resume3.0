@let person = model.data();
<div class="intro">
    <p class="greeting">Hello<span class="color-orange">.</span></p>
    <h1 class="headline">
        <span class="decoration-line color-orange"
            aria-hidden="true">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>
        <span class="name"> I'm {{ person?.firstName }} </span> <br>
        <span class="designation">{{ person?.jobTitle }}</span>
    </h1>

    <div class="action">
        <a class="custom-btn" matButton="outlined" [href]="model.resume.url" [attr.download]="model.resume.fileName"
            type="application/pdf">My Resume</a>
    </div>
</div>
