<section class="section page-width" aria-labelledby="about-me-heading">
  <div class="section-header reveal">
    <h2 id="about-me-heading" class="section-heading">About <em>Me</em></h2>
  </div>

  <div class="about-grid">
    @if (model.data(); as person) {
    <p class="summary reveal">{{ person.summary }}</p>
    }

    <ul class="stats">
      @for (highlight of model.highlights(); track highlight.label) {
      <li class="stat reveal">
        <span class="stat-value">{{ highlight.value }}<span class="stat-plus" aria-hidden="true">+</span></span>
        <span class="stat-label">{{ highlight.label }}</span>
      </li>
      }
    </ul>
  </div>
</section>
