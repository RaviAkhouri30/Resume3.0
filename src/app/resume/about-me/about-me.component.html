<section class="about-me-section" aria-labelledby="about-me-heading">
  <h2 id="about-me-heading" class="section-heading">About Me</h2>
  @if (model.data(); as person) {
  <p class="summary">{{ person.summary }}</p>
  }
  <ul class="experience-parameters">
    @for (highlight of model.highlights(); track highlight.label) {
    <li>
      <span class="years">{{ highlight.value }}</span>&nbsp;<i class="bi bi-plus" aria-hidden="true"></i>
      <p class="parameter-label">{{ highlight.label }}</p>
    </li>
    }
  </ul>
</section>
