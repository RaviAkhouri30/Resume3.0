<section class="education">
    <div class="title" aria-label="Education">
        <h3> Education</h3>
    </div>

            @for (item of model.data; track $index) {
            <ul class="timeline">
                <li>
                    <div class="heading">
                        <div class="heading-container">
                            <h6>{{ item.instituteName }} ( {{item.university}} ) </h6>
                            <h5>{{ item.degree }} @if(item.major){({{item.major}})}</h5>
                        </div>
                    </div>
                    <div class="content-container">
                        <article class="content">
                            Grade: {{item.grade}} ({{item.graduationYear}})
                        </article>
                    </div>
                </li>
            </ul>
            }
</section>
