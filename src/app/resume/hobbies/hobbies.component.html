<section class="hobbies">
    <div class="title" aria-label="Hobbies">
        <h3>Hobbies</h3>
    </div>
    <div class="inner-container">
        <ul class="timeline">
            @for (item of model.data; track $index) {
            <li>
                <strong>
                    <p class="hobby-list"> {{item.hobby}} <i class="{{item.icon}}"></i> </p>
                </strong>
                <p> {{item.description}} </p>
            </li>
            }
        </ul>
    </div>
</section>
