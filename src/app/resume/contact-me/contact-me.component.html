<section class="contact-me">
    <form>

        <mat-form-field class="full-width">
            <mat-label class="form-label">Name</mat-label>
            <input type="text" matInput name="name" id="name" />
        </mat-form-field>

        <mat-form-field class="full-width">
            <mat-label class="form-label">Email</mat-label>
            <input type="email" matInput name="email" id="email" />
        </mat-form-field>

        <mat-form-field class="full-width">
            <mat-label class="form-label">Message</mat-label>
            <textarea matInput></textarea>
        </mat-form-field>

        <section class="button-submit">
            <button type="submit" matButton="outlined">Send</button>
        </section>

    </form>
</section>
