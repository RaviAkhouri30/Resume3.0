<section class="skills" aria-labelledby="skills-heading">
    <h2 id="skills-heading" class="visually-hidden">Skills</h2>
    <div class="marquee">
        <ul class="track">
            @for (skill of trackItems(); track $index) {
            <li [attr.aria-hidden]="$index >= skillCount() || null">{{ skill }}</li>
            }
        </ul>
        <!-- Second copy makes the loop seamless; hidden from assistive technology. -->
        <ul class="track" aria-hidden="true">
            @for (skill of trackItems(); track $index) {
            <li>{{ skill }}</li>
            }
        </ul>
    </div>
</section>
