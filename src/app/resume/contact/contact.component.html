<ul class="contacts">
    @for (contact of model.data(); track contact.details) {
    <li class="contact-row">
        <a class="contact-link" [href]="contact.href">
            <span class="contact-icon" aria-hidden="true"><i class="{{ contact.icon }}"></i></span>
            <span class="contact-details">{{ contact.details }}</span>
        </a>
        <button type="button" class="copy" (click)="model.copy(contact)"
            [attr.aria-label]="'Copy ' + contact.details">
            <i [class]="model.copiedDetails() === contact.details ? 'bi bi-check2' : 'bi bi-copy'"
                aria-hidden="true"></i>
        </button>
    </li>
    }
</ul>
