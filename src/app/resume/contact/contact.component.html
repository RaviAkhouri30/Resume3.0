<ul class="contacts">
    @for (contact of model.data(); track contact.details) {
    <li>
        <a [href]="contact.href">
            <i class="{{ contact.icon }}" aria-hidden="true"></i> {{ contact.details }}
        </a>
        <button type="button" class="action" (click)="model.copy(contact)"
            [attr.aria-label]="'Copy ' + contact.details">
            <i [class]="model.copiedDetails() === contact.details ? 'bi bi-clipboard-check-fill' : 'bi bi-clipboard'"
                aria-hidden="true"></i>
        </button>
    </li>
    }
</ul>
