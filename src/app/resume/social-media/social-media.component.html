<nav class="social-media" aria-label="Social profiles">
    @for (link of model.links(); track link.url) {
    <a class="social-icons" [href]="link.url" target="_blank" rel="noopener noreferrer" [attr.aria-label]="link.label">
        <i [class]="link.icon" aria-hidden="true"></i>
    </a>
    }
</nav>
